name: Bump & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de bump'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Lire version actuelle
        id: current
        run: |
          NAME=$(grep 'versionName' dixit-companion/build.gradle | grep -oP '"\K[^"]+')
          CODE=$(grep 'versionCode' dixit-companion/build.gradle | grep -oP 'versionCode \K\d+')
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Calculer nouvelle version
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.name }}"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "name=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "code=$((${{ steps.current.outputs.code }}+1))" >> $GITHUB_OUTPUT

      - name: Mettre à jour build.gradle
        run: |
          sed -i "s/versionCode ${{ steps.current.outputs.code }}/versionCode ${{ steps.next.outputs.code }}/" dixit-companion/build.gradle
          sed -i "s/versionName \"${{ steps.current.outputs.name }}\"/versionName \"${{ steps.next.outputs.name }}\"/" dixit-companion/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ${{ github.workspace }}/dixit-release.jks

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/dixit-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: dixit
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Commit, tag et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dixit-companion/build.gradle
          git commit -m "chore: bump version → ${{ steps.next.outputs.name }} (code ${{ steps.next.outputs.code }})"
          git tag "v${{ steps.next.outputs.name }}"
          git push origin master --follow-tags

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ steps.next.outputs.name }}
          path: dixit-companion/build/outputs/bundle/release/*.aab

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: fr.erban.dixitcompanion
          releaseFiles: dixit-companion/build/outputs/bundle/release/*.aab
          track: internal
          changesNotSentForReview: true
